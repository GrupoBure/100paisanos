<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Convertir imágenes a WEBP (offline)</title>
<style>
  :root{--bg:#0e1116;--card:#161b22;--text:#e6edf3;--muted:#9aa4b2;--acc:#22c55e;--err:#ef4444}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Roboto,Helvetica,Arial}
  header{padding:22px 18px;text-align:center;border-bottom:1px solid #222}
  h1{margin:0 0 6px;font-size:20px}
  .wrap{max-width:1000px;margin:22px auto;padding:0 16px}
  .controls{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:14px}
  .card{background:var(--card);border:1px solid #222;border-radius:14px;padding:14px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input[type="file"]{width:100%}
  .drop{border:2px dashed #334155;border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
  .drop.drag{border-color:var(--acc);color:var(--text)}
  .row{display:flex;align-items:center;gap:10px}
  .row input[type="number"]{width:100%;padding:8px;border-radius:10px;border:1px solid #334155;background:#0b0f14;color:var(--text)}
  .slider{width:100%}
  .btn{background:var(--acc);color:#06280f;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn-sec{background:#30363d;color:var(--text)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:14px}
  figure{margin:0;background:#0b0f14;border:1px solid #222;border-radius:12px;overflow:hidden}
  figure img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
  figcaption{padding:10px;font-size:12px;color:var(--muted)}
  progress{width:100%}
  footer{opacity:.7;text-align:center;margin:24px 0 36px;font-size:13px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#0f172a;color:#cbd5e1;border:1px solid #263042;margin-left:6px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Conversor a <code>WEBP</code> (todo local)</h1>
  <div>Arrastra imágenes o usa el selector. <span class="pill">PNG/JPG/JPEG/GIF/BMP/SVG*</span></div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="card">
      <label for="file">Seleccionar imágenes</label>
      <input id="file" type="file" accept="image/*" multiple />
      <div id="drop" class="drop" tabindex="0">Suelta aquí tus imágenes…</div>
    </div>

    <div class="card">
      <label>Calidad WEBP: <span id="qVal">0.90</span></label>
      <input id="quality" class="slider" type="range" min="0.1" max="1" step="0.01" value="0.9" />
      <div style="height:8px"></div>
      <label>Tamaño (opcional)</label>
      <div class="row">
        <input id="maxW" type="number" placeholder="Ancho máx (px)" min="1" />
        <input id="maxH" type="number" placeholder="Alto máx (px)" min="1" />
      </div>
      <small style="color:#9aa4b2">Si dejas ambos vacíos, conserva tamaño original.</small>
    </div>

    <div class="card">
      <label>Acciones</label>
      <div class="row" style="flex-wrap:wrap">
        <button id="convert" class="btn" disabled>Convertir a WEBP</button>
        <button id="downloadAll" class="btn btn-sec" disabled>Descargar ZIP</button>
        <button id="clear" class="btn btn-sec">Limpiar</button>
      </div>
      <div style="margin-top:10px">
        <progress id="prog" value="0" max="1" hidden></progress>
        <div id="status" style="margin-top:6px;color:#9aa4b2"></div>
      </div>
    </div>
  </div>

  <div id="thumbs" class="grid" aria-live="polite"></div>
</div>

<footer>
  * SVG/GIF se rasterizan (pierden animación/EXIF). Conversión 100% en tu navegador.
</footer>

<!-- JSZip para empaquetar en ZIP (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
(() => {
  const $ = sel => document.querySelector(sel);
  const fileInput = $('#file');
  const drop = $('#drop');
  const quality = $('#quality');
  const qVal = $('#qVal');
  const maxW = $('#maxW');
  const maxH = $('#maxH');
  const convertBtn = $('#convert');
  const downAllBtn = $('#downloadAll');
  const clearBtn = $('#clear');
  const thumbs = $('#thumbs');
  const prog = $('#prog');
  const status = $('#status');

  /** Estado */
  let files = [];
  let results = []; // {name, blob, url, size}

  function fmtBytes(b){ if(b===0) return '0 B'; const k=1024, dm=1, sizes=['B','KB','MB','GB']; const i=Math.floor(Math.log(b)/Math.log(k)); return parseFloat((b/Math.pow(k,i)).toFixed(dm))+' '+sizes[i]; }

  /** Cargar archivos */
  function pushFiles(list){
    for (const f of list){
      if(!f.type.startsWith('image/')) continue;
      files.push(f);
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.alt = f.name;
      img.src = URL.createObjectURL(f);
      const cap = document.createElement('figcaption');
      cap.textContent = f.name + ' • ' + fmtBytes(f.size);
      fig.appendChild(img); fig.appendChild(cap);
      thumbs.appendChild(fig);
    }
    if(files.length){ convertBtn.disabled=false; status.textContent = `${files.length} archivo(s) listos.`; }
  }

  fileInput.addEventListener('change', e => pushFiles(e.target.files));

  ;['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ;['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => pushFiles(e.dataTransfer.files));

  quality.addEventListener('input', () => qVal.textContent = Number(quality.value).toFixed(2));

  clearBtn.addEventListener('click', () => {
    files = []; results.forEach(r=>URL.revokeObjectURL(r.url)); results=[];
    thumbs.innerHTML=''; fileInput.value=''; convertBtn.disabled=true; downAllBtn.disabled=true;
    status.textContent=''; prog.hidden=true; prog.value=0;
  });

  async function imageToBitmap(file){
    // SVG/GIF serán rasterizados por drawImage
    const img = new Image();
    img.decoding = 'async';
    img.src = URL.createObjectURL(file);
    await img.decode();
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    let w = w0, h = h0;

    const mw = parseInt(maxW.value,10); const mh = parseInt(maxH.value,10);
    if(mw>0 || mh>0){
      const r = w/h;
      if(mw>0 && (w>mw)){ w = mw; h = Math.round(w/r); }
      if(mh>0 && (h>mh)){ h = mh; w = Math.round(h*r); }
    }

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    // Fondo transparente por defecto; si la imagen trae fondo, se conserva
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);
    return canvas;
  }

  async function convertAll(){
    if(!files.length) return;
    prog.hidden=false; prog.value=0; status.textContent='Convirtiendo…';
    results.forEach(r=>URL.revokeObjectURL(r.url)); results=[];

    for (let i=0;i<files.length;i++){
      const f = files[i];
      try{
        const canvas = await imageToBitmap(f);
        const q = Math.min(1, Math.max(0.1, parseFloat(quality.value)||0.9));
        const blob = await new Promise(res => canvas.toBlob(res, 'image/webp', q));
        const base = f.name.replace(/\.[^.]+$/,'');
        const name = `${base}.webp`;
        const url = URL.createObjectURL(blob);
        results.push({name, blob, url, size: blob.size});

        // UI: miniatura resultado
        const fig = document.createElement('figure');
        const img = document.createElement('img'); img.src = url; img.alt = name;
        const cap = document.createElement('figcaption');
        const a = document.createElement('a'); a.href=url; a.download=name; a.textContent='Descargar';
        a.className='btn btn-sec'; a.style.padding='6px 10px'; a.style.display='inline-block'; a.style.marginTop='6px';
        cap.innerHTML = `${name} • ${fmtBytes(blob.size)}<br/>`; cap.appendChild(a);
        fig.appendChild(img); fig.appendChild(cap); thumbs.appendChild(fig);
      }catch(err){
        console.error(err);
        const warn = document.createElement('div');
        warn.style.color='var(--err)'; warn.textContent = `Error con ${f.name}`;
        thumbs.appendChild(warn);
      }
      prog.value = (i+1)/files.length;
    }
    downAllBtn.disabled = results.length===0;
    status.textContent = results.length ? `Listo: ${results.length} convertido(s).` : 'No se pudo convertir.';
  }

  convertBtn.addEventListener('click', convertAll);

  downAllBtn.addEventListener('click', async () => {
    if(!results.length) return;
    status.textContent = 'Empaquetando ZIP…';
    const zip = new JSZip();
    results.forEach(r => zip.file(r.name, r.blob));
    const blob = await zip.generateAsync({type:'blob'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'webp_convertidos.zip';
    document.body.appendChild(a); a.click(); a.remove();
    status.textContent = `ZIP listo (${fmtBytes(blob.size)}).`;
  });

})();
</script>
</body>
</html>
